name: Orca Deploy
on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3"
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Lint
      run: bun run lint
    # Intentionally run typecheck + build explicitly for CI visibility,
    # even though prepublishOnly also runs them before publish.
    - name: Typecheck
      run: bun run typecheck
    - name: Build
      run: bun run build
    - name: Publish
      run: npm publish --access public --provenance
