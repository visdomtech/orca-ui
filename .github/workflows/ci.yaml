name: Orca Deploy
on:
  workflow_dispatch:
  push:
    braches:
    - *
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Lint
      run: bun run lint
    - name: Typecheck
      run: bun run typecheck
    - name: Build
      run: bun run build
